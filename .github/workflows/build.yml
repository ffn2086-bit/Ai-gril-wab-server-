name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android Platform
        run: |
          NAME=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}')
          echo "Project name: $NAME"
          flutter create . --platforms=android --org com.aigf --project-name "$NAME"

      - name: Upgrade speech_to_text
        run: flutter pub add speech_to_text

      - name: Get Dependencies
        run: flutter pub get

      - name: Force compileSdk 36 for all plugins
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.library') || p.plugins.hasPlugin('com.android.application')) {
                p.android.compileSdkVersion 36
              }
            }
          }
          EOF
          cat ~/.gradle/init.gradle

      - name: Build APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: grep -n -B2 -A12 "What went wrong" build.log | head -60

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
