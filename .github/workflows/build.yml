name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android Platform
        run: |
          NAME=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}')
          echo "Project name: $NAME"
          flutter create . --platforms=android --org com.aigf --project-name "$NAME"

      - name: Upgrade speech_to_text
        run: flutter pub add speech_to_text

      - name: Get Dependencies
        run: flutter pub get

      - name: Fix compileSdk
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/compileSdk(Version)?( =)? *flutter\.compileSdkVersion/compileSdk = 36/' "$f"
              echo "== $f =="
              grep -n "compileSdk" "$f"
            fi
          done

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
