name: ai_girlfriend
description: AI girlfriend voice chat app powered by Gemini & Telegram Sync.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  audioplayers: ^6.0.0
  permission_handler: ^11.3.0
  photo_manager: ^3.0.0

flutter:
  uses-material-design: true
  
